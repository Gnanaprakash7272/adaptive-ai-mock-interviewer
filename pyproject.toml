[project]
name = "ai-mock-interview"
version = "0.1.0"
description = "AI-powered mock technical interview platform"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pymupdf>=1.28.2",
    "google-genai>=1.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.141.1",
    "uvicorn>=0.53.0",
    "python-multipart>=0.0.32",
    "supabase>=2.31.0",
    "langgraph>=0.2.0",
    "pyjwt>=2.8.0",
    "requests>=2.34.2",
    "langgraph-checkpoint-postgres>=3.1.2",
    "psycopg[binary]>=3.2.0",
    "argon2-cffi>=23.1.0",
    "slowapi>=0.1.9",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

# ---------------------------------------------------------------------------
# NOTE: pytest configuration lives in pytest.ini (not here) to avoid
# F:\ root traversal issues with pytest 9.x on Windows restricted drives.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100
exclude = [".venv", "scratch_frontend", "node_modules"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",   # line too long — enforced by line-length above
    "B008",   # do not perform function calls in argument defaults (FastAPI pattern)
    "UP007",  # allow Optional[X] syntax for now
]

[tool.ruff.lint.isort]
known-first-party = [
    "api", "gemini_config", "ai_schemas",
    "resume_intelligence", "answer_intelligence",
    "question_intelligence", "adaptive_intelligence",
    "report_intelligence", "langgraph_workflow",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
exclude = [".venv", "scratch_frontend", "node_modules"]
